name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: souqna
          POSTGRES_PASSWORD: souqna
          POSTGRES_DB: souqna
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U souqna" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://souqna:souqna@localhost:5432/souqna
      TEST_DATABASE_URL: postgres://souqna:souqna@localhost:5432/souqna
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      TRUST_PROXY: 'true'
      SESSION_COOKIE_SECURE: 'true'
      SMS_PROVIDER: mock
      STORAGE_DRIVER: memory
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generate throwaway secrets for this run
        run: |
          for name in PHONE_HASH_KEY OTP_HASH_KEY IP_HASH_KEY FIELD_ENCRYPTION_KEY_V1; do
            echo "$name=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          done

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate and seed database
        run: pnpm db:migrate && pnpm db:seed

      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code packages/db/migrations || (echo "Schema changed without a migration. Run: pnpm db:generate" && exit 1)
          test -z "$(git status --porcelain packages/db/migrations)"

      - name: Unit and API tests (incl. authorisation / IDOR tests)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @souqna/web exec playwright install --with-deps chromium

      - name: End-to-end tests (Arabic RTL at 360px, login flow, JS budget, CSP)
        run: pnpm e2e

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high --prod
